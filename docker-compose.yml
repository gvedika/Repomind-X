services:
  backend:
    build: ./backend
    environment:
      REPOSITORY_ROOT: /data/repos
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      GRAPH_BACKEND: ${GRAPH_BACKEND:-neo4j}
      CHROMA_HOST: ${CHROMA_HOST:-chromadb}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Alibaba-NLP/gte-modernbert-base}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      ENABLE_LLM_REASONING: ${ENABLE_LLM_REASONING:-true}
      MCP_SERVER_COMMAND: python -m app.mcp_server.server
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      ALLOW_GRAPH_FALLBACK: ${ALLOW_GRAPH_FALLBACK:-true}
    volumes:
      - repo_data:/data/repos
      - ./examples:/opt/examples:ro
    ports: ["8000:8000"]
    depends_on:
      neo4j: {condition: service_healthy}
      chromadb: {condition: service_healthy}
      mlflow: {condition: service_started}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health/dependencies')"]
      interval: 20s
      timeout: 10s
      retries: 8

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost/health >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
    ports: ["7474:7474","7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:7474 >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.23
    ports: ["8001:8000"]
    volumes: ["chroma_data:/chroma/chroma"]
    healthcheck:
      test: ["CMD","sh","-c","wget -qO- http://localhost:8000/api/v2/heartbeat >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlartifacts
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow","mlflow_data:/mlartifacts"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [backend]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro","grafana_data:/var/lib/grafana"]
    depends_on: [prometheus]

volumes:
  repo_data:
  neo4j_data:
  chroma_data:
  mlflow_data:
  grafana_data:
